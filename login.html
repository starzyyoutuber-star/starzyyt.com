
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<title>Sign In - Watcher</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0e0e10;
--white:#efeff1;
--muted:#a0a0a5;
--blue:#307aae;
}
body{
min-height:100vh;
min-height:100dvh;
background:var(--bg);
color:var(--white);
font-family:Arial,Helvetica,sans-serif;
display:flex;
flex-direction:column;
}
.header{
height:65px;
padding:0 22px;
display:flex;
align-items:center;
}
.logo{font-size:23px;font-weight:800;letter-spacing:-1px}
main{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:25px 18px 50px;
}
.login-container{width:100%;max-width:390px}
.heading{margin-bottom:25px}
.heading h1{font-size:25px;letter-spacing:-.7px;margin-bottom:8px}
.heading p{color:var(--muted);font-size:13px;line-height:1.5}
.field-label{
display:block;
font-size:12px;
color:#c5c5cb;
font-weight:600;
margin-bottom:8px;
}
.field{
width:100%;
height:44px;
border:1px solid #36363c;
border-radius:7px;
background:#101012;
color:white;
padding:0 12px;
outline:none;
font-size:13px;
margin-bottom:18px;
}
.field::placeholder{color:#707078}
.field:focus{border-color:var(--blue)}
.password-wrap{position:relative}
.password-wrap .field{padding-right:55px}
.show-password{
position:absolute;
right:12px;
top:13px;
border:none;
background:transparent;
color:#a0a0a5;
font-size:11px;
cursor:pointer;
}
.login-button{
width:100%;
height:44px;
border:none;
border-radius:7px;
background:var(--blue);
color:white;
font-size:13px;
font-weight:700;
cursor:pointer;
}
.login-button:active{background:#28648e}
.login-button:disabled{opacity:.6;cursor:wait}
.message{
display:none;
padding:11px;
margin-top:14px;
border-radius:6px;
font-size:12px;
line-height:1.5;
}
.message.error{
display:block;
background:#321a1a;
color:#ff9292;
border:1px solid #572626;
}
.message.success{
display:block;
background:#172c22;
color:#91d5a8;
border:1px solid #28533a;
}
.signup-text{
text-align:center;
color:var(--muted);
font-size:12px;
margin-top:24px;
}
.signup-text a{
color:#80b8df;
font-weight:600;
text-decoration:none;
}
</style>
</head>

<body>

<header class="header">
<div class="logo">Watcher</div>
</header>

<main>
<div class="login-container">

<div class="heading">
<h1>Welcome back</h1>
<p>Sign in to your Watcher account and continue watching.</p>
</div>

<form id="loginForm">

<label class="field-label" for="email">Email address</label>
<input class="field" id="email"
type="email"
placeholder="Enter your email"
autocomplete="email" required>

<label class="field-label" for="password">Password</label>
<div class="password-wrap">
<input class="field" id="password"
type="password"
placeholder="Enter your password"
autocomplete="current-password" required>

<button type="button" class="show-password"
onclick="togglePassword()">Show</button>
</div>

<button class="login-button" id="loginButton" type="submit">
Sign in
</button>

<div class="message" id="message"></div>

</form>

<div class="signup-text">
Don't have an account? <a href="signup.html">Create account</a>
</div>

</div>
</main>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://sjtaagrvncysbrpwqdzf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_gl-4fo7fyf5_roAfbTXOCA_1tp68ewn';

const supabase = createClient(SUPABASE_URL,SUPABASE_KEY);

const form = document.getElementById('loginForm');
const message = document.getElementById('message');
const button = document.getElementById('loginButton');

function showMessage(text,type){
message.textContent = text;
message.className = 'message ' + type;
}

window.togglePassword = function(){
const input = document.getElementById('password');
const btn = document.querySelector('.show-password');

input.type = input.type === 'password' ? 'text' : 'password';
btn.textContent = input.type === 'password' ? 'Show' : 'Hide';
};

form.addEventListener('submit',async(e)=>{
e.preventDefault();

const email = document.getElementById('email').value.trim();
const password = document.getElementById('password').value;

button.disabled = true;
button.textContent = 'Signing in...';
message.className = 'message';

try{
const {data,error} = await supabase.auth.signInWithPassword({
email,
password
});

if(error) throw error;

showMessage('Signed in successfully! Redirecting...','success');

setTimeout(()=>{
window.location.href='index.html';
},1000);

}catch(error){
let errorText = error.message || 'Unable to sign in.';

if(errorText.toLowerCase().includes('invalid login credentials')){
errorText = 'Incorrect email or password.';
}

if(errorText.toLowerCase().includes('email not confirmed')){
errorText = 'Please verify your email address before signing in.';
}

showMessage(errorText,'error');

}finally{
button.disabled = false;
button.textContent = 'Sign in';
}
});
</script>

</body>
</html>
