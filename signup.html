
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<title>Sign Up - Watcher</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0e0e10;
--white:#efeff1;
--muted:#a0a0a5;
--blue:#307aae;
}
body{
min-height:100vh;
min-height:100dvh;
background:var(--bg);
color:var(--white);
font-family:Arial,Helvetica,sans-serif;
display:flex;
flex-direction:column;
}
.header{
height:65px;
padding:0 22px;
display:flex;
align-items:center;
}
.logo{font-size:23px;font-weight:800;letter-spacing:-1px}
main{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:25px 18px 50px;
}
.signup-container{width:100%;max-width:390px}
.heading{margin-bottom:25px}
.heading h1{font-size:25px;letter-spacing:-.7px;margin-bottom:8px}
.heading p{color:var(--muted);font-size:13px;line-height:1.5}
.field-label{
display:block;
font-size:12px;
color:#c5c5cb;
font-weight:600;
margin-bottom:8px;
}
.field{
width:100%;
height:44px;
border:1px solid #36363c;
border-radius:7px;
background:#101012;
color:white;
padding:0 12px;
outline:none;
font-size:13px;
margin-bottom:18px;
}
.field::placeholder{color:#707078}
.field:focus{border-color:var(--blue)}
.password-wrap{position:relative}
.password-wrap .field{padding-right:55px}
.show-password{
position:absolute;
right:12px;
top:13px;
border:none;
background:transparent;
color:#a0a0a5;
font-size:11px;
cursor:pointer;
}
.terms{
display:flex;
align-items:flex-start;
gap:9px;
margin:2px 0 19px;
color:#a0a0a5;
font-size:11px;
line-height:1.5;
}
.terms input{accent-color:var(--blue);margin-top:2px}
.terms a,.login-text a{color:#80b8df;text-decoration:none}
.signup-button{
width:100%;
height:44px;
border:none;
border-radius:7px;
background:var(--blue);
color:white;
font-size:13px;
font-weight:700;
cursor:pointer;
}
.signup-button:active{background:#28648e}
.signup-button:disabled{opacity:.6;cursor:wait}
.message{
display:none;
padding:11px;
margin-top:14px;
border-radius:6px;
font-size:12px;
line-height:1.5;
}
.message.error{
display:block;
background:#321a1a;
color:#ff9292;
border:1px solid #572626;
}
.message.success{
display:block;
background:#172c22;
color:#91d5a8;
border:1px solid #28533a;
}
.login-text{
text-align:center;
color:var(--muted);
font-size:12px;
margin-top:24px;
}
.login-text a{font-weight:600}
</style>
</head>

<body>
<header class="header">
<div class="logo">Watcher</div>
</header>

<main>
<div class="signup-container">

<div class="heading">
<h1>Create your account</h1>
<p>Join Watcher and discover creators, watch live streams, and share your own content.</p>
</div>

<form id="signupForm">

<label class="field-label" for="username">Username</label>
<input class="field" id="username"
type="text" maxlength="24"
placeholder="Choose a username"
autocomplete="username" required>

<label class="field-label" for="email">Email address</label>
<input class="field" id="email"
type="email"
placeholder="Enter your email"
autocomplete="email" required>

<label class="field-label" for="password">Password</label>
<div class="password-wrap">
<input class="field" id="password"
type="password" minlength="8"
placeholder="Create a password"
autocomplete="new-password" required>
<button type="button" class="show-password"
onclick="togglePassword()">Show</button>
</div>

<label class="terms">
<input type="checkbox" id="terms" required>
<span>I agree to Watcher's <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</span>
</label>

<button class="signup-button" id="signupButton" type="submit">
Create account
</button>

<div class="message" id="message"></div>

</form>

<div class="login-text">
Already have an account? <a href="login.html">Sign in</a>
</div>

</div>
</main>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://sjtaagrvncysbrpwqdzf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_gl-4fo7fyf5_roAfbTXOCA_1tp68ewn';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const form = document.getElementById('signupForm');
const message = document.getElementById('message');
const button = document.getElementById('signupButton');

function showMessage(text,type){
message.textContent = text;
message.className = 'message ' + type;
}

window.togglePassword = function(){
const input = document.getElementById('password');
const btn = document.querySelector('.show-password');

input.type = input.type === 'password' ? 'text' : 'password';
btn.textContent = input.type === 'password' ? 'Show' : 'Hide';
};

form.addEventListener('submit',async(e)=>{
e.preventDefault();

const username = document.getElementById('username').value.trim();
const email = document.getElementById('email').value.trim();
const password = document.getElementById('password').value;
const terms = document.getElementById('terms').checked;

if(username.length < 3){
showMessage('Your username must be at least 3 characters.','error');
return;
}

if(!/^[a-zA-Z0-9_]+$/.test(username)){
showMessage('Username can only contain letters, numbers, and underscores.','error');
return;
}

if(password.length < 8){
showMessage('Your password must be at least 8 characters.','error');
return;
}

if(!terms){
showMessage('Please agree to the Terms of Service and Privacy Policy.','error');
return;
}

button.disabled = true;
button.textContent = 'Creating account...';
message.className = 'message';

try{
const {data,error} = await supabase.auth.signUp({
email,
password,
options:{
data:{
username:username
},
emailRedirectTo:new URL('login.html',window.location.href).href
}
});

if(error) throw error;

if(data.session){
showMessage('Your account was created successfully! Redirecting...','success');
setTimeout(()=>window.location.href='index.html',1200);
}else{
showMessage('Account created! Please check your email and verify your address before signing in.','success');
form.reset();
}

}catch(error){
let errorText = error.message || 'Something went wrong.';

if(errorText.toLowerCase().includes('duplicate') ||
errorText.toLowerCase().includes('unique')){
errorText = 'That username is already taken. Please choose another.';
}

showMessage(errorText,'error');

}finally{
button.disabled = false;
button.textContent = 'Create account';
}
});
</script>

</body>
</html>
